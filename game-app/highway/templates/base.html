<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Highway Game</title></head>
<body><header><a href="{{ url_for('index') }}">Highway Game</a>
{% if current_user.is_authenticated %}<a href="{{ url_for('dashboard') }}">My results</a>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Sign out</button></form>
{% else %}<a href="{{ url_for('register') }}">Register</a> <a href="{{ url_for('login_view') }}">Sign in</a>{% endif %}</header>
<main>{% block content %}{% endblock %}</main></body></html>
