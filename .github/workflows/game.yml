name: Check highway application
on:
  pull_request:
    paths: ['game-app/**', '.github/workflows/game.yml']
  push:
    branches: [main]
    paths: ['game-app/**', '.github/workflows/game.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r game-app/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: game-app
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game-app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
